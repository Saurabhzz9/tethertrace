name: CI

on:
  push:
    # main, plus ci/* branches so a maintainer can run CI on a branch without opening a pull request
    branches: [main, "ci/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: CLI starts
        run: node dist/cli.js --help

  # Builds the example app the way a new user's computer would: every JDK and Android SDK on the
  # runner is ignored, so the toolchain is downloaded from nothing.
  build-from-nothing:
    name: build from nothing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      TETHERTRACE_MANAGED_ONLY: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The runner context is not available in job-level env, so the empty home is set here.
      - name: use an empty tethertrace home
        run: echo "TETHERTRACE_HOME=$(node -p "require('path').join(process.env.RUNNER_TEMP, 'tethertrace-home')")" >> "$GITHUB_ENV"
      - name: doctor says what is missing
        run: |
          node dist/cli.js doctor examples/android-hello | tee doctor.txt || true
          grep -q "missing: A JDK" doctor.txt
          grep -q "missing: No Android SDK" doctor.txt
      - name: nothing is downloaded without approval
        run: |
          node dist/cli.js build examples/android-hello --json > declined.json < /dev/null || true
          node -e "const r=require('./declined.json'); if (r.ok || r.error.category !== 'consent_declined') { console.error(r); process.exit(1) }"
          test ! -d "$TETHERTRACE_HOME/toolchains/jdk"
      - name: build with a downloaded toolchain
        run: |
          if ! node dist/cli.js build examples/android-hello --yes --json > result.json 2> build.err; then
            cat build.err result.json || true
            tail -n 80 examples/android-hello/build/tethertrace/build.log || true
            # Put the reason on the run summary page, where it can be read without opening the log.
            node scripts/ci-annotate.mjs result.json build.err
            exit 1
          fi
          cat build.err result.json
          node -e "
            const r = require('./result.json');
            const a = r.artifacts[0];
            const home = process.env.TETHERTRACE_HOME.replace(/\\\\/g, '/');
            const under = (p) => p.replace(/\\\\/g, '/').startsWith(home);
            const ok = r.ok && a.packageName === 'com.example.hello' && a.versionName === '0.3' && a.signature.v2plus && under(r.toolchain.jdk) && under(r.toolchain.sdk);
            if (!ok) process.exit(1);
          "
      - name: the platform tethertrace installed was used as it is
        run: |
          test -f "$TETHERTRACE_HOME/toolchains/android-sdk/platforms/android-36/package.xml"
          test ! -d "$TETHERTRACE_HOME/toolchains/android-sdk/cmdline-tools"
          # If the Android Gradle Plugin had not recognised it, it would have installed the platform again.
          # (Platform-Tools and Build-Tools are separate packages that Gradle fetches itself.)
          again=$(grep -E "Install Android SDK Platform [0-9]" examples/android-hello/build/tethertrace/build.log | head -n 3 | paste -sd " " - || true)
          if [ -n "$again" ]; then
            echo "::error title=SDK platform::Gradle installed the platform again, so the one tethertrace installed was not recognised: $again"
            exit 1
          fi
          echo "::notice title=SDK packages Gradle fetched itself::$(grep -E "Install .* (ready|finished|complete)" examples/android-hello/build/tethertrace/build.log | paste -sd " " - | cut -c1-600)"
      - name: what was downloaded
        run: node dist/cli.js toolchain list
      - name: second build works offline
        run: |
          node dist/cli.js build examples/android-hello --offline --json > offline.json || (cat offline.json; exit 1)
          node -e "if (!require('./offline.json').ok) process.exit(1)"
